<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Naveen Shankar — Under Maintenance</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080b10;color:#f5f7fa;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:center}.card{width:min(680px,calc(100% - 40px));padding:56px 32px;border:1px solid rgba(255,255,255,.1);border-radius:24px;background:rgba(255,255,255,.035);box-shadow:0 24px 80px rgba(0,0,0,.35)}.mark{width:58px;height:58px;margin:0 auto 24px;border-radius:16px;display:grid;place-items:center;background:#fff;color:#080b10;font-size:25px;font-weight:800}.eyebrow{font-size:.75rem;letter-spacing:.18em;text-transform:uppercase;opacity:.55}.title{margin:14px 0 12px;font-size:clamp(2rem,6vw,3.5rem);line-height:1.05}.copy{max-width:500px;margin:0 auto;color:#aeb6c2;line-height:1.7}.pulse{display:inline-flex;align-items:center;gap:8px;margin-top:28px;color:#cfd5dd;font-size:.9rem}.dot{width:8px;height:8px;border-radius:50%;background:#7cff9e;box-shadow:0 0 16px #7cff9e;animation:pulse 1.8s infinite}@keyframes pulse{50%{opacity:.35;transform:scale(.8)}}.name{margin-top:34px;font-size:.85rem;opacity:.45}
</style>
</head>
<body><main class="card"><div class="mark">N</div><div class="eyebrow">naveenshankar.in</div><h1 class="title">Under Maintenance</h1><p class="copy">The website is temporarily unavailable while I work on a few improvements. Please check back soon.</p><div class="pulse"><span class="dot"></span> Work in progress</div><div class="name">Naveen Shankar</div></main></body>
</html>
