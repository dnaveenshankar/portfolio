name = "naveenshankar-api"
main = "src/sana-booking-worker.js"
compatibility_date = "2025-01-01"

routes = [
  { pattern = "api.naveenshankar.in", custom_domain = true }
]

[[d1_databases]]
binding = "DB"
database_name = "naveenshankar-db"
database_id = "93ce8223-8916-4d2e-b32f-8b61308ceb5f"

[ai]
binding = "AI"

# Set secrets with: wrangler secret put SESSION_SECRET
# RESEND_API_KEY is optional but required for Sana email verification.
# SANA_FROM_EMAIL is optional and should be a verified sender address.

[vars]
CF_ZONE_ID = ""
