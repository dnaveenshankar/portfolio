name: Update sitemap

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate sitemap
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.sax.saxutils import escape

          base = "https://naveenshankar.in"
          pages = [Path("index.html")] + sorted(
              p for p in Path(".").glob("*.html") if p.name != "index.html"
          )

          lines = [
              '<?xml version="1.0" encoding="UTF-8"?>',
              '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">',
          ]
          for page in pages:
              path = "/" if page.name == "index.html" else f"/{page.name}"
              lines.append(f"  <url><loc>{escape(base + path)}</loc></url>")
          lines.append('</urlset>')
          Path("sitemap.xml").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Commit sitemap if changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          if git diff --cached --quiet; then
            echo "Sitemap is already current."
          else
            git commit -m "chore: update sitemap"
            git push
          fi
