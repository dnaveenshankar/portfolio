<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Blog — naveenshankar.in Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="/admin.css" />
</head>
<body>
<header>
  <a href="/dashboard.html">&larr; Dashboard</a>
  <h1>Blog</h1>
</header>

<main>
  <div id="itemsContainer"></div>

  <div class="add-form">
    <h2>New post</h2>
    <label>Title</label>
    <input id="newTitle" />
    <label>Slug</label>
    <input id="newSlug" placeholder="auto-generated from title, editable" />
    <label>Content</label>
    <textarea id="newContent"></textarea>
    <div class="pub-row"><input type="checkbox" id="newPublished" /> <label style="margin:0;">Published</label></div>
    <button class="primary" id="addBtn">Create Post</button>
    <div class="msg" id="addMsg"></div>
  </div>
</main>

<script>
const API = "https://api.naveenshankar.in";
const token = sessionStorage.getItem("admin_token");
if (!token) window.location.href = "/login.html";

const authedFetch = (path, opts = {}) =>
  fetch(`${API}${path}`, {
    ...opts,
    headers: { ...(opts.headers || {}), Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
  });

function slugify(s) {
  return s.toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
}

const titleInput = document.getElementById("newTitle");
const slugInput = document.getElementById("newSlug");
let slugManuallyEdited = false;
slugInput.addEventListener("input", () => (slugManuallyEdited = true));
titleInput.addEventListener("input", () => {
  if (!slugManuallyEdited) slugInput.value = slugify(titleInput.value);
});

async function loadPosts() {
  const res = await authedFetch("/admin/blog");
  if (res.status === 401) { window.location.href = "/login.html"; return; }
  const data = await res.json();
  const container = document.getElementById("itemsContainer");

  if (!data.items || data.items.length === 0) {
    container.innerHTML = '<div class="empty">No posts yet.</div>';
    return;
  }

  container.innerHTML = data.items
    .map(
      (p) => `<div class="item-card" data-id="${p.id}">
        <label>Title</label><input data-field="title" value="${p.title}" />
        <label>Slug</label><input data-field="slug" value="${p.slug}" />
        <label>Content</label><textarea data-field="content">${p.content || ""}</textarea>
        <div class="pub-row"><input type="checkbox" data-field="published" ${p.published ? "checked" : ""} /> <label style="margin:0;">Published</label></div>
        <div class="actions">
          <button class="small saveBtn">Save</button>
          <button class="small danger deleteBtn">Delete</button>
        </div>
      </div>`
    )
    .join("");

  container.querySelectorAll(".item-card").forEach((card) => {
    const id = card.dataset.id;
    card.querySelector(".saveBtn").addEventListener("click", async () => {
      const payload = {
        title: card.querySelector('[data-field="title"]').value,
        slug: card.querySelector('[data-field="slug"]').value,
        content: card.querySelector('[data-field="content"]').value,
        published: card.querySelector('[data-field="published"]').checked,
      };
      const res = await authedFetch(`/admin/blog/${id}`, { method: "PUT", body: JSON.stringify(payload) });
      if (!res.ok) { const d = await res.json(); alert(d.error || "Save failed"); return; }
      loadPosts();
    });
    card.querySelector(".deleteBtn").addEventListener("click", async () => {
      if (!confirm("Delete this post?")) return;
      await authedFetch(`/admin/blog/${id}`, { method: "DELETE" });
      loadPosts();
    });
  });
}

document.getElementById("addBtn").addEventListener("click", async () => {
  const msg = document.getElementById("addMsg");
  const title = titleInput.value.trim();
  const slug = slugInput.value.trim();
  if (!title || !slug) { msg.style.color = "#ff6b6b"; msg.textContent = "Title and slug are required."; return; }

  const payload = {
    title,
    slug,
    content: document.getElementById("newContent").value,
    published: document.getElementById("newPublished").checked,
  };

  const res = await authedFetch("/admin/blog", { method: "POST", body: JSON.stringify(payload) });
  const data = await res.json();
  if (!res.ok) { msg.style.color = "#ff6b6b"; msg.textContent = data.error || "Failed"; return; }

  msg.style.color = "#7CFC9E";
  msg.textContent = "Created.";
  titleInput.value = "";
  slugInput.value = "";
  slugManuallyEdited = false;
  document.getElementById("newContent").value = "";
  document.getElementById("newPublished").checked = false;
  loadPosts();
});

loadPosts();
</script>
</body>
</html>
