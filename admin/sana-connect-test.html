<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sana Connect Test</title><style>body{font-family:system-ui;max-width:640px;margin:40px auto;padding:20px}button,input{padding:10px;margin:6px 0;width:100%;box-sizing:border-box}pre{background:#111;color:#0f0;padding:12px;white-space:pre-wrap;overflow:auto}</style></head><body><h1>Sana connection test</h1><p>This page creates a connection request directly, without AI intent detection.</p><input id="name" placeholder="Visitor name" value="Test Visitor"><button id="send">Send connection request</button><pre id="out">Ready.</pre><script>const API='https://api.naveenshankar.in';const KEY='sana_session';let session=localStorage.getItem(KEY);if(!session){session=(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random()).replace(/[^a-zA-Z0-9_-]/g,'').slice(0,40);localStorage.setItem(KEY,session)}document.getElementById('send').onclick=async()=>{const name=document.getElementById('name').value.trim();if(!name)return;const out=document.getElementById('out');out.textContent='Sending...';try{const r=await fetch(API+'/public/sana/connect',{method:'POST',headers:{'Content-Type':'application/json','X-Sana-Session':session,'X-Sana-Timezone':Intl.DateTimeFormat().resolvedOptions().timeZone||'Asia/Kolkata'},body:JSON.stringify({name})});const text=await r.text();out.textContent='HTTP '+r.status+'\n'+text}catch(e){out.textContent=String(e)}};</script></body></html>
