<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Change Password — naveenshankar.in Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="/admin.css" />
</head>
<body>
<div class="auth-wrap">
<form id="changeForm" class="auth-card">
  <h1>Change Password</h1>
  <p class="hint" id="forcedHint" style="display:none;">You're using the default password — please set a new one to continue.</p>
  <div class="msg" id="msg"></div>
  <input type="password" id="currentPassword" placeholder="Current password" required />
  <input type="password" id="newPassword" placeholder="New password (min 8 chars)" required minlength="8" />
  <input type="password" id="confirmPassword" placeholder="Confirm new password" required minlength="8" />
  <button type="submit">Update Password</button>
</form>
</div>

<script>
const API = "https://api.naveenshankar.in";
const token = sessionStorage.getItem("admin_token");
const msg = document.getElementById("msg");

if (!token) window.location.href = "/login.html";
if (new URLSearchParams(window.location.search).get("forced") === "1") {
  document.getElementById("forcedHint").style.display = "block";
}

document.getElementById("changeForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const currentPassword = document.getElementById("currentPassword").value;
  const newPassword = document.getElementById("newPassword").value;
  const confirmPassword = document.getElementById("confirmPassword").value;
  if (newPassword !== confirmPassword) {
    msg.style.color = "#ff6b6b";
    msg.textContent = "New passwords do not match.";
    return;
  }
  try {
    const res = await fetch(`${API}/admin/change-password`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: `Bearer ${token}`,
      },
      body: JSON.stringify({ currentPassword, newPassword }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Update failed");
    msg.style.color = "#7CFC9E";
    msg.textContent = "Password updated. Redirecting...";
    setTimeout(() => (window.location.href = "/dashboard.html"), 1200);
  } catch (ex) {
    msg.style.color = "#ff6b6b";
    msg.textContent = ex.message;
  }
});
</script>
</body>
</html>
