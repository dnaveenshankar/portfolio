<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Edit Section — naveenshankar.in Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="/admin.css?v=2" />
<script src="/admin-nav.js"></script>
</head>
<body>
<div class="app-shell">
<div id="sidebarSlot"></div>
<div class="content">
<header>
  <h1 id="pageTitle">Section</h1>
</header>

<main>
  <div id="itemsContainer"></div>

  <div class="add-form">
    <h2>Add new</h2>
    <div class="grid-fields" id="addFields"></div>
    <button class="primary" id="addBtn">Add</button>
    <div class="msg" id="addMsg"></div>
  </div>
</main>

</div>
</div>
<script>
const API = "https://api.naveenshankar.in";
const token = sessionStorage.getItem("admin_token");
if (!token) window.location.href = "/login.html";

// Field config per table — must match the Worker's GENERIC_TABLES columns.
const TABLE_FIELDS = {
  experience: { title: "Experience", icon: "💼", fields: [
    { key: "role", label: "Role", type: "text" },
    { key: "company", label: "Company", type: "text" },
    { key: "location", label: "Location", type: "text" },
    { key: "start_date", label: "Start Date", type: "text", placeholder: "YYYY-MM" },
    { key: "end_date", label: "End Date", type: "text", placeholder: "YYYY-MM or Present" },
    { key: "description", label: "Description", type: "textarea", full: true },
    { key: "sort_order", label: "Order", type: "number" },
  ]},
  education: { title: "Education", icon: "🎓", fields: [
    { key: "institution", label: "Institution", type: "text" },
    { key: "degree", label: "Degree", type: "text" },
    { key: "field", label: "Field", type: "text" },
    { key: "start_date", label: "Start Date", type: "text" },
    { key: "end_date", label: "End Date", type: "text" },
    { key: "description", label: "Description", type: "textarea", full: true },
    { key: "sort_order", label: "Order", type: "number" },
  ]},
  projects: { title: "Projects", icon: "🚀", fields: [
    { key: "title", label: "Title", type: "text" },
    { key: "url", label: "Live URL", type: "text" },
    { key: "repo_url", label: "Repo URL", type: "text" },
    { key: "tech_stack", label: "Tech Stack", type: "text", placeholder: "comma separated" },
    { key: "description", label: "Description", type: "textarea", full: true },
    { key: "sort_order", label: "Order", type: "number" },
  ]},
  certifications: { title: "Certifications", icon: "📜", fields: [
    { key: "name", label: "Name", type: "text" },
    { key: "issuer", label: "Issuer", type: "text" },
    { key: "issue_date", label: "Issue Date", type: "text" },
    { key: "credential_url", label: "Credential URL", type: "text", full: true },
    { key: "sort_order", label: "Order", type: "number" },
  ]},
  achievements: { title: "Achievements", icon: "🏆", fields: [
    { key: "title", label: "Title", type: "text" },
    { key: "date", label: "Date", type: "text" },
    { key: "description", label: "Description", type: "textarea", full: true },
    { key: "sort_order", label: "Order", type: "number" },
  ]},
  workshops: { title: "Workshops", icon: "🧑‍🏫", fields: [
    { key: "title", label: "Title", type: "text" },
    { key: "role", label: "Role", type: "text", placeholder: "Speaker / Attendee" },
    { key: "organizer", label: "Organizer", type: "text" },
    { key: "date", label: "Date", type: "text" },
    { key: "description", label: "Description", type: "textarea", full: true },
    { key: "sort_order", label: "Order", type: "number" },
  ]},
  testimonials: { title: "Testimonials", icon: "⭐", fields: [
    { key: "name", label: "Name", type: "text" },
    { key: "role", label: "Role", type: "text" },
    { key: "company", label: "Company", type: "text" },
    { key: "quote", label: "Quote", type: "textarea", full: true },
    { key: "sort_order", label: "Order", type: "number" },
  ]},
  social_links: { title: "Social Links", icon: "🔗", fields: [
    { key: "platform", label: "Platform", type: "text", placeholder: "LinkedIn / GitHub / ..." },
    { key: "url", label: "URL", type: "text" },
    { key: "sort_order", label: "Order", type: "number" },
  ]},
  services: { title: "Services", icon: "🧩", fields: [
    { key: "name", label: "Name", type: "text" },
    { key: "description", label: "Description", type: "textarea", full: true },
    { key: "sort_order", label: "Order", type: "number" },
  ]},
};

const table = new URLSearchParams(window.location.search).get("table");
const config = TABLE_FIELDS[table];

if (!config) {
  document.body.innerHTML = '<main style="padding:2rem;"><p>Unknown section. <a href="/dashboard.html" style="color:#8aa4ff;">Back to dashboard</a></p></main>';
  throw new Error("Unknown table");
}

document.getElementById("pageTitle").textContent = `${config.icon || ""} ${config.title}`;
document.title = `${config.title} — naveenshankar.in Admin`;

const authedFetch = (path, opts = {}) =>
  fetch(`${API}${path}`, {
    ...opts,
    headers: { ...(opts.headers || {}), Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
  });

function renderFieldInputs(container, prefix, values = {}) {
  container.innerHTML = config.fields
    .map((f) => {
      const val = values[f.key] ?? "";
      if (f.key === "sort_order") {
        return `<input type="hidden" data-field="sort_order" value="${val || 0}" />`;
      }
      const cls = f.full ? "full" : "";
      const inputEl =
        f.type === "textarea"
          ? `<textarea data-field="${f.key}">${val}</textarea><button type="button" class="ai" data-ai-for="${f.key}">✨ AI Assist</button><div class="ai-preview" data-preview-for="${f.key}" style="display:none;"></div>`
          : `<input type="${f.type}" data-field="${f.key}" value="${val}" placeholder="${f.placeholder || ""}" />`;
      return `<div class="${cls}"><label>${f.label}</label>${inputEl}</div>`;
    })
    .join("");

  container.querySelectorAll("[data-ai-for]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const field = config.fields.find((f) => f.key === btn.dataset.aiFor);
      const textarea = container.querySelector(`[data-field="${field.key}"]`);
      const previewBox = container.querySelector(`[data-preview-for="${field.key}"]`);
      btn.disabled = true;
      btn.textContent = "✨ Thinking…";
      try {
        const res = await authedFetch("/admin/ai/assist", {
          method: "POST",
          body: JSON.stringify({
            instruction: `Write or improve the "${field.label}" text for a ${config.title} entry on a professional portfolio. Keep it to 1-3 sentences.`,
            text: textarea.value,
          }),
        });
        const data = await res.json();
        if (data.suggestion) {
          previewBox.innerHTML = `
            <div style="background:var(--accent-teal-soft); border:1px solid var(--accent-teal); border-radius:var(--radius-sm); padding:.7rem; margin:-0.4rem 0 .8rem;">
              <div style="font-size:.68rem; font-weight:700; color:#0891a8; text-transform:uppercase; margin-bottom:.3rem;">✨ AI Suggestion</div>
              <div style="font-size:.85rem; margin-bottom:.5rem;">${data.suggestion}</div>
              <button type="button" class="small acceptSuggestion" style="border-color:var(--success); color:var(--success);">✅ Use this</button>
              <button type="button" class="small discardSuggestion">✖️ Discard</button>
            </div>`;
          previewBox.style.display = "block";
          previewBox.querySelector(".acceptSuggestion").addEventListener("click", () => {
            textarea.value = data.suggestion;
            previewBox.style.display = "none";
          });
          previewBox.querySelector(".discardSuggestion").addEventListener("click", () => {
            previewBox.style.display = "none";
          });
        } else {
          showToast(data.error || "AI returned an empty suggestion.", "error");
        }
      } catch (e) {
        showToast("AI assist failed — try again.", "error");
      } finally {
        btn.disabled = false;
        btn.textContent = "✨ AI Assist";
      }
    });
  });
}

function readFieldInputs(container) {
  const payload = {};
  container.querySelectorAll("[data-field]").forEach((el) => {
    payload[el.dataset.field] = el.value;
  });
  return payload;
}

let draggedCard = null;

function setupDragAndDrop(container) {
  container.querySelectorAll(".item-card").forEach((card) => {
    card.setAttribute("draggable", "true");

    card.addEventListener("dragstart", () => {
      draggedCard = card;
      setTimeout(() => card.classList.add("dragging"), 0);
    });
    card.addEventListener("dragend", () => {
      card.classList.remove("dragging");
      container.querySelectorAll(".item-card").forEach((c) => c.classList.remove("drag-over"));
    });
    card.addEventListener("dragover", (e) => {
      e.preventDefault();
      if (card !== draggedCard) card.classList.add("drag-over");
    });
    card.addEventListener("dragleave", () => card.classList.remove("drag-over"));
    card.addEventListener("drop", async (e) => {
      e.preventDefault();
      card.classList.remove("drag-over");
      if (!draggedCard || draggedCard === card) return;

      const cards = [...container.querySelectorAll(".item-card")];
      const fromIdx = cards.indexOf(draggedCard);
      const toIdx = cards.indexOf(card);
      if (fromIdx < toIdx) card.after(draggedCard);
      else card.before(draggedCard);

      // Recompute sort_order for every card in the new order and persist each change.
      const reordered = [...container.querySelectorAll(".item-card")];
      await Promise.all(
        reordered.map((c, i) => {
          const orderInput = c.querySelector('[data-field="sort_order"]');
          if (orderInput) orderInput.value = i;
          const payload = readFieldInputs(c);
          return authedFetch(`/admin/data/${table}/${c.dataset.id}`, { method: "PUT", body: JSON.stringify(payload) });
        })
      );
    });
  });
}

async function loadItems() {
  const res = await authedFetch(`/admin/data/${table}`);
  if (res.status === 401) { window.location.href = "/login.html"; return; }
  const data = await res.json();
  const container = document.getElementById("itemsContainer");

  if (!data.items || data.items.length === 0) {
    container.innerHTML = '<div class="empty">Nothing here yet — add one below.</div>';
    return;
  }

  container.innerHTML = data.items
    .map((item) => `<div class="item-card" data-id="${item.id}">
      <span class="drag-handle" title="Drag to reorder">⠿</span>
      <div class="grid-fields fieldGrid"></div>
      <div class="actions">
        <button class="small saveBtn">Save</button>
        <button class="small danger deleteBtn">Delete</button>
      </div>
    </div>`)
    .join("");

  container.querySelectorAll(".item-card").forEach((card) => {
    const id = card.dataset.id;
    const item = data.items.find((i) => String(i.id) === id);
    renderFieldInputs(card.querySelector(".fieldGrid"), "edit", item);

    card.querySelector(".saveBtn").addEventListener("click", async () => {
      const payload = readFieldInputs(card);
      await authedFetch(`/admin/data/${table}/${id}`, { method: "PUT", body: JSON.stringify(payload) });
      showToast("Saved", "success");
      loadItems();
    });
    card.querySelector(".deleteBtn").addEventListener("click", async () => {
      if (!confirm("Delete this entry?")) return;
      await authedFetch(`/admin/data/${table}/${id}`, { method: "DELETE" });
      showToast("Deleted", "success");
      loadItems();
    });
  });

  setupDragAndDrop(container);
}

renderFieldInputs(document.getElementById("addFields"), "new");

document.getElementById("addBtn").addEventListener("click", async () => {
  const msg = document.getElementById("addMsg");
  const payload = readFieldInputs(document.getElementById("addFields"));

  const res = await authedFetch(`/admin/data/${table}`, { method: "POST", body: JSON.stringify(payload) });
  const data = await res.json();
  if (!res.ok) { msg.style.color = "#ff6b6b"; msg.textContent = data.error || "Failed to add"; return; }

  msg.style.color = "#7CFC9E";
  msg.textContent = "Added.";
  renderFieldInputs(document.getElementById("addFields"), "new");
  loadItems();
});

loadItems();
</script>
</body>
</html>
