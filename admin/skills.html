<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Skills — naveenshankar.in Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background:#0f1115; color:#eee; margin:0; }
  header { display:flex; align-items:center; gap:1rem; padding:1rem 1.5rem; border-bottom:1px solid #23262e; }
  header a { color:#8aa4ff; text-decoration:none; font-size:.85rem; }
  header h1 { font-size:1.1rem; margin:0; }
  main { max-width:700px; margin:2rem auto; padding:0 1.5rem; }
  table { width:100%; border-collapse:collapse; background:#181b21; border-radius:10px; overflow:hidden; margin-bottom:1.5rem; }
  th, td { text-align:left; padding:.6rem .8rem; font-size:.85rem; border-bottom:1px solid #23262e; }
  th { color:#999; font-weight:600; font-size:.72rem; text-transform:uppercase; }
  tr:last-child td { border-bottom:none; }
  .empty { color:#666; font-size:.85rem; padding:1rem; text-align:center; }
  button.small { background:none; border:1px solid #333; color:#ccc; padding:.3rem .6rem; border-radius:5px; cursor:pointer; font-size:.75rem; margin-right:.4rem; }
  button.small:hover { border-color:#4f7cff; color:#fff; }
  button.small.danger:hover { border-color:#ff6b6b; color:#ff6b6b; }
  .add-form { background:#181b21; padding:1.2rem; border-radius:10px; }
  .add-form h2 { font-size:.9rem; margin:0 0 .8rem; }
  .row { display:flex; gap:.6rem; margin-bottom:.7rem; }
  input { flex:1; padding:.5rem; border-radius:6px; border:1px solid #333; background:#0f1115; color:#eee; font-size:.85rem; }
  input.narrow { flex:0 0 90px; }
  button.primary { padding:.55rem 1.2rem; border:none; border-radius:6px; background:#4f7cff; color:#fff; font-weight:600; cursor:pointer; font-size:.85rem; }
  .msg { font-size:.8rem; margin-top:.6rem; min-height:1em; }
</style>
</head>
<body>
<header>
  <a href="/dashboard.html">&larr; Dashboard</a>
  <h1>Skills</h1>
</header>

<main>
  <table id="skillsTable">
    <thead><tr><th>Name</th><th>Category</th><th>Proficiency</th><th>Order</th><th></th></tr></thead>
    <tbody></tbody>
  </table>

  <div class="add-form">
    <h2>Add a skill</h2>
    <div class="row">
      <input id="newName" placeholder="Name (e.g. JavaScript)" />
      <input id="newCategory" placeholder="Category (e.g. Frontend)" />
      <input id="newProficiency" class="narrow" type="number" min="0" max="100" placeholder="0-100" />
      <input id="newOrder" class="narrow" type="number" placeholder="Order" />
    </div>
    <button class="primary" id="addBtn">Add Skill</button>
    <div class="msg" id="addMsg"></div>
  </div>
</main>

<script>
const API = "https://api.naveenshankar.in";
const token = sessionStorage.getItem("admin_token");
if (!token) window.location.href = "/login.html";

const authedFetch = (path, opts = {}) =>
  fetch(`${API}${path}`, {
    ...opts,
    headers: { ...(opts.headers || {}), Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
  });

async function loadSkills() {
  const res = await authedFetch("/admin/skills");
  if (res.status === 401) { window.location.href = "/login.html"; return; }
  const data = await res.json();
  const tbody = document.querySelector("#skillsTable tbody");

  if (!data.skills || data.skills.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" class="empty">No skills yet</td></tr>';
    return;
  }

  tbody.innerHTML = data.skills
    .map(
      (s) => `<tr data-id="${s.id}">
        <td><input value="${s.name}" data-field="name" /></td>
        <td><input value="${s.category || ""}" data-field="category" /></td>
        <td><input type="number" min="0" max="100" value="${s.proficiency || ""}" data-field="proficiency" style="width:70px" /></td>
        <td><input type="number" value="${s.sort_order || 0}" data-field="sort_order" style="width:60px" /></td>
        <td>
          <button class="small saveBtn">Save</button>
          <button class="small danger deleteBtn">Delete</button>
        </td>
      </tr>`
    )
    .join("");

  tbody.querySelectorAll("tr").forEach((row) => {
    const id = row.dataset.id;
    row.querySelector(".saveBtn").addEventListener("click", async () => {
      const payload = {};
      row.querySelectorAll("[data-field]").forEach((inp) => (payload[inp.dataset.field] = inp.value));
      await authedFetch(`/admin/skills/${id}`, { method: "PUT", body: JSON.stringify(payload) });
      loadSkills();
    });
    row.querySelector(".deleteBtn").addEventListener("click", async () => {
      if (!confirm("Delete this skill?")) return;
      await authedFetch(`/admin/skills/${id}`, { method: "DELETE" });
      loadSkills();
    });
  });
}

document.getElementById("addBtn").addEventListener("click", async () => {
  const msg = document.getElementById("addMsg");
  const name = document.getElementById("newName").value.trim();
  if (!name) { msg.style.color = "#ff6b6b"; msg.textContent = "Name is required."; return; }

  const payload = {
    name,
    category: document.getElementById("newCategory").value.trim(),
    proficiency: document.getElementById("newProficiency").value ? parseInt(document.getElementById("newProficiency").value, 10) : null,
    sort_order: document.getElementById("newOrder").value ? parseInt(document.getElementById("newOrder").value, 10) : 0,
  };

  const res = await authedFetch("/admin/skills", { method: "POST", body: JSON.stringify(payload) });
  const data = await res.json();
  if (!res.ok) { msg.style.color = "#ff6b6b"; msg.textContent = data.error || "Failed to add"; return; }

  msg.style.color = "#7CFC9E";
  msg.textContent = "Added.";
  ["newName", "newCategory", "newProficiency", "newOrder"].forEach((id) => (document.getElementById(id).value = ""));
  loadSkills();
});

loadSkills();
</script>
</body>
</html>
