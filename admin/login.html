<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Admin Login — naveenshankar.in</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="/admin.css" />
</head>
<body>
<div class="auth-wrap">
<form id="loginForm" class="auth-card">
  <h1>🔐 Admin Login</h1>
  <div class="error" id="err"></div>
  <input type="text" id="username" placeholder="Username" autocomplete="username" required />
  <input type="password" id="password" placeholder="Password" autocomplete="current-password" required />
  <button type="submit" id="submitBtn">Log In</button>
  <div class="links"><a href="/forgot-password.html">Forgot password?</a></div>
</form>
</div>

<script>
const API = "https://api.naveenshankar.in";
const form = document.getElementById("loginForm");
const err = document.getElementById("err");
const btn = document.getElementById("submitBtn");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  err.textContent = "";
  btn.disabled = true;
  try {
    const res = await fetch(`${API}/admin/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        username: document.getElementById("username").value.trim(),
        password: document.getElementById("password").value,
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Login failed");

    sessionStorage.setItem("admin_token", data.token);
    window.location.href = data.mustChangePassword ? "/change-password.html?forced=1" : "/dashboard.html";
  } catch (ex) {
    err.textContent = ex.message;
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
