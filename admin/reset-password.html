<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Reset Password — naveenshankar.in Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="/admin.css?v=2" />
</head>
<body>
<div class="auth-wrap">
<form id="resetForm" class="auth-card">
  <h1>🔑 Set a New Password</h1>
  <div class="msg" id="msg"></div>
  <input type="password" id="newPassword" placeholder="New password (min 8 chars)" required minlength="8" />
  <input type="password" id="confirmPassword" placeholder="Confirm new password" required minlength="8" />
  <button type="submit">Reset Password</button>
</form>
</div>

<script>
const API = "https://api.naveenshankar.in";
const params = new URLSearchParams(window.location.search);
const token = params.get("token");
const msg = document.getElementById("msg");

if (!token) {
  msg.style.color = "#ff6b6b";
  msg.textContent = "Missing or invalid reset link.";
  document.getElementById("resetForm").querySelector("button").disabled = true;
}

document.getElementById("resetForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const newPassword = document.getElementById("newPassword").value;
  const confirmPassword = document.getElementById("confirmPassword").value;
  if (newPassword !== confirmPassword) {
    msg.style.color = "#ff6b6b";
    msg.textContent = "Passwords do not match.";
    return;
  }
  try {
    const res = await fetch(`${API}/admin/reset-password`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token, newPassword }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Reset failed");
    msg.style.color = "#7CFC9E";
    msg.textContent = "Password updated. Redirecting to login...";
    setTimeout(() => (window.location.href = "/login.html"), 1500);
  } catch (ex) {
    msg.style.color = "#ff6b6b";
    msg.textContent = ex.message;
  }
});
</script>
</body>
</html>
