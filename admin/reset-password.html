<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Reset Password — naveenshankar.in Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  body { font-family: system-ui, sans-serif; background:#0f1115; color:#eee; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; }
  form { background:#181b21; padding:2rem; border-radius:10px; width:300px; box-shadow:0 10px 30px rgba(0,0,0,.4); }
  h1 { font-size:1.1rem; margin:0 0 1.2rem; }
  input { width:100%; padding:.6rem; margin-bottom:.9rem; border-radius:6px; border:1px solid #333; background:#0f1115; color:#eee; box-sizing:border-box; }
  button { width:100%; padding:.65rem; border:none; border-radius:6px; background:#4f7cff; color:#fff; font-weight:600; cursor:pointer; }
  .msg { font-size:.85rem; margin-bottom:.8rem; min-height:1em; }
</style>
</head>
<body>
<form id="resetForm">
  <h1>Set a New Password</h1>
  <div class="msg" id="msg"></div>
  <input type="password" id="newPassword" placeholder="New password (min 8 chars)" required minlength="8" />
  <input type="password" id="confirmPassword" placeholder="Confirm new password" required minlength="8" />
  <button type="submit">Reset Password</button>
</form>

<script>
const API = "https://api.naveenshankar.in";
const params = new URLSearchParams(window.location.search);
const token = params.get("token");
const msg = document.getElementById("msg");

if (!token) {
  msg.style.color = "#ff6b6b";
  msg.textContent = "Missing or invalid reset link.";
  document.getElementById("resetForm").querySelector("button").disabled = true;
}

document.getElementById("resetForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const newPassword = document.getElementById("newPassword").value;
  const confirmPassword = document.getElementById("confirmPassword").value;
  if (newPassword !== confirmPassword) {
    msg.style.color = "#ff6b6b";
    msg.textContent = "Passwords do not match.";
    return;
  }
  try {
    const res = await fetch(`${API}/admin/reset-password`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token, newPassword }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Reset failed");
    msg.style.color = "#7CFC9E";
    msg.textContent = "Password updated. Redirecting to login...";
    setTimeout(() => (window.location.href = "/login.html"), 1500);
  } catch (ex) {
    msg.style.color = "#ff6b6b";
    msg.textContent = ex.message;
  }
});
</script>
</body>
</html>
