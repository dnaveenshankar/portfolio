<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Forgot Password — naveenshankar.in Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  body { font-family: system-ui, sans-serif; background:#0f1115; color:#eee; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; }
  form { background:#181b21; padding:2rem; border-radius:10px; width:300px; box-shadow:0 10px 30px rgba(0,0,0,.4); }
  h1 { font-size:1.1rem; margin:0 0 .6rem; }
  p.hint { font-size:.8rem; color:#999; margin:0 0 1.2rem; }
  input { width:100%; padding:.6rem; margin-bottom:.9rem; border-radius:6px; border:1px solid #333; background:#0f1115; color:#eee; box-sizing:border-box; }
  button { width:100%; padding:.65rem; border:none; border-radius:6px; background:#4f7cff; color:#fff; font-weight:600; cursor:pointer; }
  .msg { font-size:.85rem; margin-bottom:.8rem; min-height:1em; }
  .links { text-align:center; margin-top:1rem; font-size:.85rem; }
  .links a { color:#8aa4ff; text-decoration:none; }
</style>
</head>
<body>
<form id="forgotForm">
  <h1>Forgot Password</h1>
  <p class="hint">Enter your admin username. If it exists, a reset link will be sent.</p>
  <div class="msg" id="msg"></div>
  <input type="text" id="username" placeholder="Username" required />
  <button type="submit">Send Reset Link</button>
  <div class="links"><a href="/login.html">Back to login</a></div>
</form>

<script>
const API = "https://api.naveenshankar.in";
document.getElementById("forgotForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("msg");
  msg.style.color = "#eee";
  msg.textContent = "Sending...";
  try {
    const res = await fetch(`${API}/admin/forgot-password`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: document.getElementById("username").value.trim() }),
    });
    const data = await res.json();
    msg.textContent = data.message || "If that account exists, a reset link has been sent.";
  } catch {
    msg.style.color = "#ff6b6b";
    msg.textContent = "Something went wrong. Try again later.";
  }
});
</script>
</body>
</html>
