<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Forgot Password — naveenshankar.in Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="/admin.css" />
</head>
<body>
<div class="auth-wrap">
<form id="forgotForm" class="auth-card">
  <h1>❓ Forgot Password</h1>
  <p class="hint">Enter your admin username. If it exists, a reset link will be sent.</p>
  <div class="msg" id="msg"></div>
  <input type="text" id="username" placeholder="Username" required />
  <button type="submit">Send Reset Link</button>
  <div class="links"><a href="/login.html">Back to login</a></div>
</form>
</div>

<script>
const API = "https://api.naveenshankar.in";
document.getElementById("forgotForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("msg");
  msg.style.color = "#eee";
  msg.textContent = "Sending...";
  try {
    const res = await fetch(`${API}/admin/forgot-password`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: document.getElementById("username").value.trim() }),
    });
    const data = await res.json();
    msg.textContent = data.message || "If that account exists, a reset link has been sent.";
  } catch {
    msg.style.color = "#ff6b6b";
    msg.textContent = "Something went wrong. Try again later.";
  }
});
</script>
</body>
</html>
