<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Availability — naveenshankar.in Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="/admin.css?v=2" />
<script src="/admin-nav.js"></script>
</head>
<body>
<div class="app-shell">
<div id="sidebarSlot"></div>
<div class="content">
<header>
  <h1>🗓️ Availability</h1>
  <a href="/shift-types.html">⏰ Configure Shift Hours</a>
</header>

<main>
  <table id="availTable">
    <thead><tr><th>Date</th><th>Shift</th><th>Note</th><th></th></tr></thead>
    <tbody></tbody>
  </table>

  <div class="add-form">
    <h2>Add a day</h2>
    <div class="row">
      <input id="newDate" type="date" />
      <select id="newShift"></select>
      <input id="newNote" placeholder="Note (optional)" />
    </div>
    <button class="primary" id="addBtn">Add</button>
    <div class="msg" id="addMsg"></div>
  </div>
</main>

</div>
</div>
<script>
const API = "https://api.naveenshankar.in";
const token = sessionStorage.getItem("admin_token");
if (!token) window.location.href = "/login.html";

const authedFetch = (path, opts = {}) =>
  fetch(`${API}${path}`, {
    ...opts,
    headers: { ...(opts.headers || {}), Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
  });

let SHIFTS = [];

function shiftOptionsHtml(selectedCode) {
  return SHIFTS.map(
    (s) => `<option value="${s.code}" ${s.code === selectedCode ? "selected" : ""}>${s.code} — ${s.label}${s.is_off ? "" : ` (${s.start_time}-${s.end_time}${s.end_next_day ? " ND" : ""})`}</option>`
  ).join("");
}

async function loadShiftTypes() {
  const res = await fetch(`${API}/public/shift-types`);
  const data = await res.json();
  SHIFTS = data.items || [];
  document.getElementById("newShift").innerHTML = shiftOptionsHtml(SHIFTS[0]?.code);
}

async function loadAvailability() {
  const res = await authedFetch("/admin/availability");
  if (res.status === 401) { window.location.href = "/login.html"; return; }
  const data = await res.json();
  const tbody = document.querySelector("#availTable tbody");

  if (!data.items || data.items.length === 0) {
    tbody.innerHTML = '<tr><td colspan="4" class="empty">No availability entries yet</td></tr>';
    return;
  }

  tbody.innerHTML = data.items
    .map(
      (a) => `<tr data-id="${a.id}">
        <td data-label="Date"><input type="date" data-field="date" value="${a.date}" /></td>
        <td data-label="Shift"><select data-field="shift_type">${shiftOptionsHtml(a.shift_type)}</select></td>
        <td data-label="Note"><input data-field="note" value="${a.note || ""}" /></td>
        <td data-label="">
          <button class="small saveBtn">Save</button>
          <button class="small danger deleteBtn">Delete</button>
        </td>
      </tr>`
    )
    .join("");

  tbody.querySelectorAll("tr").forEach((row) => {
    const id = row.dataset.id;
    row.querySelector(".saveBtn").addEventListener("click", async () => {
      const payload = {
        date: row.querySelector('[data-field="date"]').value,
        shift_type: row.querySelector('[data-field="shift_type"]').value,
        note: row.querySelector('[data-field="note"]').value,
      };
      await authedFetch(`/admin/availability/${id}`, { method: "PUT", body: JSON.stringify(payload) });
      showToast("Availability saved", "success");
      loadAvailability();
    });
    row.querySelector(".deleteBtn").addEventListener("click", async () => {
      if (!confirm("Delete this entry?")) return;
      await authedFetch(`/admin/availability/${id}`, { method: "DELETE" });
      showToast("Entry deleted", "success");
      loadAvailability();
    });
  });
}

document.getElementById("addBtn").addEventListener("click", async () => {
  const msg = document.getElementById("addMsg");
  const date = document.getElementById("newDate").value;
  if (!date) { msg.style.color = "#e11d48"; msg.textContent = "Date is required."; return; }

  const payload = {
    date,
    shift_type: document.getElementById("newShift").value,
    note: document.getElementById("newNote").value,
  };

  const res = await authedFetch("/admin/availability", { method: "POST", body: JSON.stringify(payload) });
  const data = await res.json();
  if (!res.ok) { msg.style.color = "#e11d48"; msg.textContent = data.error || "Failed"; return; }

  msg.style.color = "#28c76f";
  msg.textContent = "Added.";
  document.getElementById("newDate").value = "";
  document.getElementById("newNote").value = "";
  loadAvailability();
});

(async () => {
  await loadShiftTypes();
  await loadAvailability();
})();
</script>
</body>
</html>
