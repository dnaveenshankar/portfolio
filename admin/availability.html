<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Availability — naveenshankar.in Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background:#0f1115; color:#eee; margin:0; }
  header { display:flex; align-items:center; gap:1rem; padding:1rem 1.5rem; border-bottom:1px solid #23262e; }
  header a { color:#8aa4ff; text-decoration:none; font-size:.85rem; }
  header h1 { font-size:1.1rem; margin:0; }
  main { max-width:700px; margin:2rem auto; padding:0 1.5rem; }
  table { width:100%; border-collapse:collapse; background:#181b21; border-radius:10px; overflow:hidden; margin-bottom:1.5rem; }
  th, td { text-align:left; padding:.6rem .8rem; font-size:.85rem; border-bottom:1px solid #23262e; }
  th { color:#999; font-weight:600; font-size:.72rem; text-transform:uppercase; }
  tr:last-child td { border-bottom:none; }
  .empty { color:#666; font-size:.85rem; padding:1rem; text-align:center; }
  input, select { padding:.45rem; border-radius:6px; border:1px solid #333; background:#0f1115; color:#eee; font-size:.82rem; }
  button.small { background:none; border:1px solid #333; color:#ccc; padding:.3rem .6rem; border-radius:5px; cursor:pointer; font-size:.75rem; margin-right:.4rem; }
  button.small:hover { border-color:#4f7cff; color:#fff; }
  button.small.danger:hover { border-color:#ff6b6b; color:#ff6b6b; }
  .add-form { background:#181b21; padding:1.2rem; border-radius:10px; }
  .add-form h2 { font-size:.9rem; margin:0 0 .8rem; }
  .row { display:flex; gap:.6rem; margin-bottom:.7rem; }
  .row > * { flex:1; }
  button.primary { padding:.55rem 1.2rem; border:none; border-radius:6px; background:#4f7cff; color:#fff; font-weight:600; cursor:pointer; font-size:.85rem; }
  .msg { font-size:.8rem; margin-top:.6rem; min-height:1em; }
</style>
</head>
<body>
<header>
  <a href="/dashboard.html">&larr; Dashboard</a>
  <h1>Availability</h1>
</header>

<main>
  <table id="availTable">
    <thead><tr><th>Date</th><th>Shift</th><th>Note</th><th></th></tr></thead>
    <tbody></tbody>
  </table>

  <div class="add-form">
    <h2>Add a day</h2>
    <div class="row">
      <input id="newDate" type="date" />
      <select id="newShift">
        <option>Morning</option>
        <option>Evening</option>
        <option>Night</option>
        <option>Off</option>
      </select>
      <input id="newNote" placeholder="Note (optional)" />
    </div>
    <button class="primary" id="addBtn">Add</button>
    <div class="msg" id="addMsg"></div>
  </div>
</main>

<script>
const API = "https://api.naveenshankar.in";
const token = sessionStorage.getItem("admin_token");
if (!token) window.location.href = "/login.html";

const authedFetch = (path, opts = {}) =>
  fetch(`${API}${path}`, {
    ...opts,
    headers: { ...(opts.headers || {}), Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
  });

const SHIFTS = ["Morning", "Evening", "Night", "Off"];

async function loadAvailability() {
  const res = await authedFetch("/admin/availability");
  if (res.status === 401) { window.location.href = "/login.html"; return; }
  const data = await res.json();
  const tbody = document.querySelector("#availTable tbody");

  if (!data.items || data.items.length === 0) {
    tbody.innerHTML = '<tr><td colspan="4" class="empty">No availability entries yet</td></tr>';
    return;
  }

  tbody.innerHTML = data.items
    .map(
      (a) => `<tr data-id="${a.id}">
        <td><input type="date" data-field="date" value="${a.date}" /></td>
        <td><select data-field="shift_type">${SHIFTS.map((s) => `<option ${s === a.shift_type ? "selected" : ""}>${s}</option>`).join("")}</select></td>
        <td><input data-field="note" value="${a.note || ""}" /></td>
        <td>
          <button class="small saveBtn">Save</button>
          <button class="small danger deleteBtn">Delete</button>
        </td>
      </tr>`
    )
    .join("");

  tbody.querySelectorAll("tr").forEach((row) => {
    const id = row.dataset.id;
    row.querySelector(".saveBtn").addEventListener("click", async () => {
      const payload = {
        date: row.querySelector('[data-field="date"]').value,
        shift_type: row.querySelector('[data-field="shift_type"]').value,
        note: row.querySelector('[data-field="note"]').value,
      };
      await authedFetch(`/admin/availability/${id}`, { method: "PUT", body: JSON.stringify(payload) });
      loadAvailability();
    });
    row.querySelector(".deleteBtn").addEventListener("click", async () => {
      if (!confirm("Delete this entry?")) return;
      await authedFetch(`/admin/availability/${id}`, { method: "DELETE" });
      loadAvailability();
    });
  });
}

document.getElementById("addBtn").addEventListener("click", async () => {
  const msg = document.getElementById("addMsg");
  const date = document.getElementById("newDate").value;
  if (!date) { msg.style.color = "#ff6b6b"; msg.textContent = "Date is required."; return; }

  const payload = {
    date,
    shift_type: document.getElementById("newShift").value,
    note: document.getElementById("newNote").value,
  };

  const res = await authedFetch("/admin/availability", { method: "POST", body: JSON.stringify(payload) });
  const data = await res.json();
  if (!res.ok) { msg.style.color = "#ff6b6b"; msg.textContent = data.error || "Failed"; return; }

  msg.style.color = "#7CFC9E";
  msg.textContent = "Added.";
  document.getElementById("newDate").value = "";
  document.getElementById("newNote").value = "";
  loadAvailability();
});

loadAvailability();
</script>
</body>
</html>
