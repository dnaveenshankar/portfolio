<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Dashboard — naveenshankar.in Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="/admin.css" />
</head>
<body>
<header>
  <h1>naveenshankar.in — Admin</h1>
  <div style="display:flex; align-items:center; gap:1rem;">
    <span class="who" id="whoami"></span>
    <button id="logoutBtn">Log out</button>
  </div>
</header>

<main>
  <div class="grid" id="statsGrid">
    <div class="card"><div class="label">Requests (7d)</div><div class="value">—</div></div>
    <div class="card"><div class="label">Page Views (7d)</div><div class="value">—</div></div>
    <div class="card"><div class="label">Unique Visitors (7d)</div><div class="value">—</div></div>
  </div>
  <div class="notice" id="statsNotice" style="display:none;">
    Visitor stats aren't configured yet. Set <code>CF_ZONE_ID</code> and a <code>CF_API_TOKEN</code> secret
    (Analytics: Read) on the Worker to enable this.
  </div>

  <section>
    <h2>Content</h2>
    <div class="cms-grid" id="cmsGrid"></div>
  </section>

  <section>
    <h2>Recent Activity</h2>
    <table id="activityTable">
      <thead><tr><th>Time</th><th>User</th><th>Action</th><th>Detail</th><th>IP</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>
</main>

<script>
const API = "https://api.naveenshankar.in";
const token = sessionStorage.getItem("admin_token");
if (!token) window.location.href = "/login.html";

const authedFetch = (path, opts = {}) =>
  fetch(`${API}${path}`, {
    ...opts,
    headers: { ...(opts.headers || {}), Authorization: `Bearer ${token}` },
  });

document.getElementById("logoutBtn").addEventListener("click", () => {
  sessionStorage.removeItem("admin_token");
  window.location.href = "/login.html";
});

// Who am I
authedFetch("/admin/me").then(async (res) => {
  if (res.status === 401) { window.location.href = "/login.html"; return; }
  const data = await res.json();
  document.getElementById("whoami").textContent = data.username || "";
});

// Stats
authedFetch("/admin/stats").then(async (res) => {
  const data = await res.json();
  if (!data.configured) {
    document.getElementById("statsNotice").style.display = "block";
    return;
  }
  const totals = data.daily.reduce(
    (acc, d) => ({
      requests: acc.requests + (d.requests || 0),
      pageViews: acc.pageViews + (d.pageViews || 0),
      uniqueVisitors: acc.uniqueVisitors + (d.uniqueVisitors || 0),
    }),
    { requests: 0, pageViews: 0, uniqueVisitors: 0 }
  );
  const cards = document.querySelectorAll("#statsGrid .value");
  cards[0].textContent = totals.requests.toLocaleString();
  cards[1].textContent = totals.pageViews.toLocaleString();
  cards[2].textContent = totals.uniqueVisitors.toLocaleString();
}).catch(() => {
  document.getElementById("statsNotice").style.display = "block";
});

// Activity log
authedFetch("/admin/activity?limit=20").then(async (res) => {
  const data = await res.json();
  const tbody = document.querySelector("#activityTable tbody");
  if (!data.activity || data.activity.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" class="empty">No activity yet</td></tr>';
    return;
  }
  tbody.innerHTML = data.activity
    .map(
      (a) => `<tr>
        <td>${new Date(a.created_at).toLocaleString()}</td>
        <td>${a.username}</td>
        <td>${a.action}</td>
        <td>${a.detail || "—"}</td>
        <td>${a.ip || "—"}</td>
      </tr>`
    )
    .join("");
});

// CMS section nav — "ready" ones have a working edit page; the rest are placeholders
// until their schema/API is built, following the phased plan.
const sections = [
  { name: "Profile", href: "/profile-edit.html", ready: true },
  { name: "Skills", href: "/skills.html", ready: true },
  { name: "Experience", href: "/data.html?table=experience", ready: true },
  { name: "Education", href: "/data.html?table=education", ready: true },
  { name: "Projects", href: "/data.html?table=projects", ready: true },
  { name: "Certifications", href: "/data.html?table=certifications", ready: true },
  { name: "Achievements", href: "/data.html?table=achievements", ready: true },
  { name: "Workshops", href: "/data.html?table=workshops", ready: true },
  { name: "Blog", href: "/blog.html", ready: true },
  { name: "Quotes", href: "/quotes.html", ready: true },
  { name: "Availability", href: "/availability.html", ready: true },
  { name: "Testimonials", href: "/data.html?table=testimonials", ready: true },
  { name: "Social Links", href: "/data.html?table=social_links", ready: true },
  { name: "Services", href: "/data.html?table=services", ready: true },
];
document.getElementById("cmsGrid").innerHTML = sections
  .map(
    (s) => `<a class="cms-card" href="${s.href}">
      <div class="name">${s.name}</div>
      <div class="status ${s.ready ? "ready" : ""}">${s.ready ? "Ready" : "Coming soon"}</div>
    </a>`
  )
  .join("");
</script>
</body>
</html>
