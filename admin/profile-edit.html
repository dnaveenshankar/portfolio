<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Edit Profile — naveenshankar.in Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="/admin.css?v=2" />
<script src="/admin-nav.js"></script>
</head>
<body>
<div class="app-shell">
<div id="sidebarSlot"></div>
<div class="content">
<header>
  <h1>👤 Edit Profile</h1>
</header>

<main>
  <form id="profileForm">
    <label for="full_name">🧑 Full name</label>
    <input id="full_name" type="text" />

    <label for="title">🏷️ Title / tagline</label>
    <input id="title" type="text" placeholder="e.g. Network Engineer" />

    <label for="bio">📝 Bio</label>
    <textarea id="bio"></textarea>
    <div style="display:flex; align-items:center; gap:.6rem; margin-bottom:1rem;">
      <button type="button" class="ai" id="aiBioBtn">✨ AI Assist</button>
      <span style="font-size:.75rem; color:var(--text-muted);">Generates a suggestion — you review it before it's applied</span>
    </div>

    <!-- AI suggestion preview — hidden until a suggestion comes back -->
    <div id="aiPreview" style="display:none; background:var(--accent-teal-soft); border:1px solid var(--accent-teal); border-radius:var(--radius-sm); padding:.9rem; margin:-0.4rem 0 1rem;">
      <div style="font-size:.72rem; font-weight:700; color:#0891a8; text-transform:uppercase; margin-bottom:.4rem;">✨ AI Suggestion</div>
      <div id="aiPreviewText" style="font-size:.88rem; margin-bottom:.7rem;"></div>
      <div style="display:flex; gap:.5rem;">
        <button type="button" class="small" id="aiAcceptBtn" style="border-color:var(--success); color:var(--success);">✅ Use this</button>
        <button type="button" class="small" id="aiDiscardBtn">✖️ Discard</button>
      </div>
    </div>

    <label for="location">📍 Location</label>
    <input id="location" type="text" placeholder="e.g. Tirupur, Tamil Nadu" />

    <label for="email">✉️ Contact email</label>
    <input id="email" type="email" />

    <label for="avatar_url">🖼️ Avatar URL</label>
    <input id="avatar_url" type="text" placeholder="https://..." />

    <button type="submit" class="primary" id="saveBtn">💾 Save Profile</button>
  </form>
</main>

</div>
</div>
<script>
const API = "https://api.naveenshankar.in";
const token = sessionStorage.getItem("admin_token");
if (!token) window.location.href = "/login.html";

const fields = ["full_name", "title", "bio", "location", "email", "avatar_url"];
const authedFetch = (path, opts = {}) =>
  fetch(`${API}${path}`, {
    ...opts,
    headers: { ...(opts.headers || {}), Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
  });

authedFetch("/admin/profile").then(async (res) => {
  if (res.status === 401) { window.location.href = "/login.html"; return; }
  const data = await res.json();
  fields.forEach((f) => {
    if (data.profile && data.profile[f]) document.getElementById(f).value = data.profile[f];
  });
});

let pendingSuggestion = "";

document.getElementById("aiBioBtn").addEventListener("click", async () => {
  const btn = document.getElementById("aiBioBtn");
  const bio = document.getElementById("bio");
  btn.disabled = true;
  btn.textContent = "✨ Thinking…";
  try {
    const res = await authedFetch("/admin/ai/assist", {
      method: "POST",
      body: JSON.stringify({
        instruction: `Write a short, professional 1-2 sentence bio for ${document.getElementById("full_name").value || "this person"}, whose title is "${document.getElementById("title").value || ""}".`,
        text: bio.value,
      }),
    });
    const data = await res.json();
    if (data.suggestion) {
      pendingSuggestion = data.suggestion;
      document.getElementById("aiPreviewText").textContent = data.suggestion;
      document.getElementById("aiPreview").style.display = "block";
    } else {
      showToast(data.error || "AI returned an empty suggestion.", "error");
    }
  } catch {
    showToast("AI assist failed — try again.", "error");
  } finally {
    btn.disabled = false;
    btn.textContent = "✨ AI Assist";
  }
});

document.getElementById("aiAcceptBtn").addEventListener("click", () => {
  document.getElementById("bio").value = pendingSuggestion;
  document.getElementById("aiPreview").style.display = "none";
  showToast("Suggestion applied — remember to Save", "success");
});

document.getElementById("aiDiscardBtn").addEventListener("click", () => {
  document.getElementById("aiPreview").style.display = "none";
});

document.getElementById("profileForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("saveBtn");
  btn.disabled = true;

  const payload = {};
  fields.forEach((f) => (payload[f] = document.getElementById(f).value));

  try {
    const res = await authedFetch("/admin/profile", { method: "PUT", body: JSON.stringify(payload) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Save failed");
    showToast("Profile saved", "success");
  } catch (ex) {
    showToast(ex.message, "error");
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
