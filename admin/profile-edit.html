<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Edit Profile — naveenshankar.in Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background:#0f1115; color:#eee; margin:0; }
  header { display:flex; align-items:center; gap:1rem; padding:1rem 1.5rem; border-bottom:1px solid #23262e; }
  header a { color:#8aa4ff; text-decoration:none; font-size:.85rem; }
  header h1 { font-size:1.1rem; margin:0; }
  main { max-width:520px; margin:2rem auto; padding:0 1.5rem; }
  label { display:block; font-size:.8rem; color:#999; margin-bottom:.3rem; margin-top:1rem; }
  input, textarea { width:100%; padding:.6rem; border-radius:6px; border:1px solid #333; background:#181b21; color:#eee; font-family:inherit; }
  textarea { min-height:100px; resize:vertical; }
  button { margin-top:1.4rem; padding:.65rem 1.4rem; border:none; border-radius:6px; background:#4f7cff; color:#fff; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.6; }
  .msg { font-size:.85rem; margin-top:.8rem; min-height:1em; }
</style>
</head>
<body>
<header>
  <a href="/dashboard.html">&larr; Dashboard</a>
  <h1>Edit Profile</h1>
</header>

<main>
  <form id="profileForm">
    <label for="full_name">Full name</label>
    <input id="full_name" type="text" />

    <label for="title">Title / tagline</label>
    <input id="title" type="text" placeholder="e.g. Software Engineer" />

    <label for="bio">Bio</label>
    <textarea id="bio"></textarea>

    <label for="location">Location</label>
    <input id="location" type="text" placeholder="e.g. Chennai, India" />

    <label for="email">Contact email</label>
    <input id="email" type="email" />

    <label for="avatar_url">Avatar URL</label>
    <input id="avatar_url" type="text" placeholder="https://..." />

    <div class="msg" id="msg"></div>
    <button type="submit" id="saveBtn">Save</button>
  </form>
</main>

<script>
const API = "https://api.naveenshankar.in";
const token = sessionStorage.getItem("admin_token");
if (!token) window.location.href = "/login.html";

const fields = ["full_name", "title", "bio", "location", "email", "avatar_url"];
const authedFetch = (path, opts = {}) =>
  fetch(`${API}${path}`, {
    ...opts,
    headers: { ...(opts.headers || {}), Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
  });

authedFetch("/admin/profile").then(async (res) => {
  if (res.status === 401) { window.location.href = "/login.html"; return; }
  const data = await res.json();
  fields.forEach((f) => {
    if (data.profile && data.profile[f]) document.getElementById(f).value = data.profile[f];
  });
});

document.getElementById("profileForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("msg");
  const btn = document.getElementById("saveBtn");
  btn.disabled = true;
  msg.textContent = "Saving...";
  msg.style.color = "#eee";

  const payload = {};
  fields.forEach((f) => (payload[f] = document.getElementById(f).value));

  try {
    const res = await authedFetch("/admin/profile", { method: "PUT", body: JSON.stringify(payload) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Save failed");
    msg.style.color = "#7CFC9E";
    msg.textContent = "Saved.";
  } catch (ex) {
    msg.style.color = "#ff6b6b";
    msg.textContent = ex.message;
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
